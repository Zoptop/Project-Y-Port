name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC, x64)
            os: windows-latest
            game: ON
          - name: Linux (GCC, x64)
            os: ubuntu-latest
            game: ON
          - name: macOS (Clang, ARM64)
            os: macos-latest
            game: OFF

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libx11-dev libxext-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPROJECTY_BUILD_GAME=${{ matrix.game }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (includes the cross-platform determinism digest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ProjectY-windows-x64
          path: build/Release/ProjectY.exe
